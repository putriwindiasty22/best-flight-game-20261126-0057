<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Valley Run</title>
<meta name="description" content="Ember Valley Run — fly the Kestrel through eight sky rings down the valley and land on the runway. A free flight game for make.fun.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1a2c; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Valley Run: fly the Kestrel through eight sky rings down the valley and land on the runway"></canvas>
<noscript><p style="color:#fff;font-family:system-ui,sans-serif;text-align:center">Ember Valley Run needs JavaScript to fly.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
